[project]
name = "basira-verify"
version = "0.1.0"
description = "Evidence-grounded verification platform for trusted Islamic knowledge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pyarrow>=25.0.1",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basira"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
