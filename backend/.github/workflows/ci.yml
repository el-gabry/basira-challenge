name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Verify lock
        run: uv lock --check

      - name: Ruff
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q
